# ============================================
# RushBot - Project Configuration
# ============================================

[project]
name = "rushbot"
version = "2026.1"
description = "Automated Bot for Rush Royale with ML-based unit recognition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RushBot Team" }
]
keywords = ["bot", "automation", "machine-learning", "opencv", "adb", "rush-royale"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0,<2.3.0",
    "opencv-python>=4.10.0",
    "pandas>=2.2.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "packaging>=24.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "threadpoolctl>=3.2.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.5.0",
    "adbutils>=2.0.0",
    "pure-python-adb>=0.3.0.dev0",
    "av>=12.0.0",
    "customtkinter>=5.2.0",
    "darkdetect>=0.8.0",
]

[project.scripts]
rushbot = "rush_bot.gui:main"

[project.optional-dependencies]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.0",
    "notebook>=7.0.0",
    "black>=25.0.0",
    "ruff>=0.8.0",
    "isort>=5.13.0",
    "pyright>=1.1.390",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
ml = [
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.4.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
all = [
    "rush-royale-bot[dev,ml,docs]",
]

[project.urls]
Homepage = "https://github.com/mleem97/RushBot"
Documentation = "https://rushbot.wiki"
Repository = "https://github.com/mleem97/RushBot"
Issues = "https://github.com/mleem97/RushBot/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rush_bot*"]

# ============================================
# Tool Configurations
# ============================================

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
extend-exclude = [
    ".bot_env",
    ".scrcpy",
    ".vs",
    "cv-images",
    "Src",  # Legacy, will be removed
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = ["E501"]  # line too long (handled by formatter)
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["rush_bot"]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".bot_env"
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
exclude = [".bot_env", ".scrcpy", "cv-images", "Src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".bot_env", ".scrcpy", "cv-images"]
