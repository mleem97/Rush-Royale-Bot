[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "rushbot"
version = "2.0.0a1"
description = "Cross-platform Android device automation and computer-vision foundation for RushBot"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "Axel Bjork" },
  { name = "Marvin" },
]
keywords = ["android", "adb", "scrcpy", "computer-vision", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=2.4,<3",
  "opencv-python>=5.0,<6",
  "pandas>=3.0,<4",
  "Pillow>=12.3,<13",
  "psutil>=7.2,<8",
  "requests>=2.34,<3",
  "scikit-learn>=1.9,<2",
  "tqdm>=4.69,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[project.scripts]
rushbot-device = "rushbot.cli:main"

[project.urls]
Repository = "https://github.com/mleem97/RushBot"
Upstream = "https://github.com/AxelBjork/Rush-Royale-Bot"

[tool.hatch.build.targets.wheel]
packages = ["src/rushbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["rushbot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
