# ============================================
# Rush Royale Bot - Project Configuration
# ============================================

[project]
name = "rush-royale-bot"
version = "2026.1"
description = "Automated Bot for Rush Royale with ML-based unit recognition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rush Royale Bot Team" }
]
keywords = ["bot", "automation", "machine-learning", "opencv", "adb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.4.0",
    "opencv-python>=4.12.0",
    "pandas>=2.3.0",
    "Pillow>=12.0.0",
    "requests>=2.32.0",
    "packaging>=24.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "threadpoolctl>=3.2.0",
    "tqdm>=4.67.0",
    "scikit-learn>=1.8.0",
    "adbutils>=2.9.0",
    "pure-python-adb>=0.3.0.dev0",
    "av>=12.0.0",
    "customtkinter>=5.2.0",
    "darkdetect>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.0",
    "notebook>=7.0.0",
    "black>=25.0.0",
    "ruff>=0.8.0",
    "isort>=5.13.0",
    "pyright>=1.1.390",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
ml = [
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.4.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
all = [
    "rush-royale-bot[dev,ml,docs]",
]

[project.urls]
Homepage = "https://github.com/yourusername/Rush-Royale-Bot"
Documentation = "https://github.com/yourusername/Rush-Royale-Bot/wiki"
Repository = "https://github.com/yourusername/Rush-Royale-Bot"
Issues = "https://github.com/yourusername/Rush-Royale-Bot/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["Src*"]

# ============================================
# Tool Configurations
# ============================================

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = '''
/(\.bot_env|\.scrcpy|\.vs|\.git|scrcpy|all_units|icons|units|old_icon)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["bot_perception", "port_scan"]
skip = [".bot_env", ".scrcpy", ".vs", ".git", "scrcpy", "all_units", "icons", "units", "old_icon"]
force_single_line = true
lines_between_types = 1

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["Src"]
extend-exclude = [
    ".bot_env",
    ".scrcpy",
    ".vs",
    "scrcpy",
    "all_units",
    "icons",
    "units",
    "old_icon",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bot_perception", "port_scan"]
force-single-line = true
lines-between-types = 1

[tool.pyright]
venvPath = "."
venv = ".bot_env"
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".bot_env", ".scrcpy", "all_units", "icons"]
