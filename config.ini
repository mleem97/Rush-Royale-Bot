[bot]
floor = 8
mana_level = 1,2,3,4,5
units = demo, phoenix, robot, dryad, riding_hood
dps_unit = monk
pve = False
require_shaman = False

[detection]
icon_threshold = 0.75
chapter_threshold = 0.60
dungeon_page_threshold = 0.55
floor_threshold = 0.70
fighting_threshold = 0.70
mse_threshold = 2500
color_quantization = 20
use_ocr_fallback = True
ocr_confidence_threshold = 0.4
chapter_scales = 0.85,0.9,0.95,1.0,1.05,1.1,1.15
debug_save_screenshots = True

[models]
rank_model_path = models/rank/rank_latest.joblib
unit_model_path = models/unit/unit_latest.joblib
legacy_rank_model = rank_model.pkl

