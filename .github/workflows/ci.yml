name: RushBot CI

on:
  push:
    branches:
      - modernization/rushbot-2.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rushbot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      # The upstream snapshot still uses `Src/`. Windows case-folds that path into
      # `src/`, so modernization gates target the isolated package until legacy
      # modules are migrated out of the conflicting directory.
      - name: Lint modernization package
        run: python -m ruff check src/rushbot tests

      - name: Check modernization formatting
        run: python -m ruff format --check src/rushbot tests

      - name: Run unit tests
        run: python -m pytest --cov=rushbot --cov-report=term-missing --cov-report=xml
